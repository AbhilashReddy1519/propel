services:
  # 1. PostgreSQL Database Service
  propel-db-service:
    image: postgres:16-alpine
    container_name: propel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: Abhilash
      POSTGRES_PASSWORD: Abhi1234
      POSTGRES_DB: propel_db
    ports:
      - "4000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Abhilash -d propel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - propel-data:/var/lib/postgresql/data
    networks:
      - propel

  # 2. Express Backend API Service
  propel-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: propel-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://Abhilash:Abhi1234@propel-db-service:5432/propel_db
      CORS_ORIGIN: http://localhost:5000,http://localhost:3000
    depends_on:
      propel-db-service:
        condition: service_healthy
    networks:
      - propel

  # 3. Next.js Operator Console Client Service
  propel-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3000/api/v1
    container_name: propel-client
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      NEXT_PUBLIC_API_BASE: http://localhost:3000/api/v1
    depends_on:
      - propel-server
    networks:
      - propel

volumes:
  propel-data:

networks:
  propel:
    driver: bridge